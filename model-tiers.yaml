        model: sonnet
        effort: high
        notes: Hard or risky implementation across a contract or several modules.
      openai:
        model: gpt-5.6-terra
        effort: high
        notes: Hard or risky implementation across a contract or several modules.
      google:
        model: gemini-3.7-flash-high
        effort: native
        notes: Hard or risky implementation across a contract or several modules.
      zai:
        model: zai-coding-plan/glm-4.7
