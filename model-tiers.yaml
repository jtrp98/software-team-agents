# Model tiers are a human-owned choice for this framework.
# Cross-camp cells are approximations chosen by a person, not equivalences.
# No automated process refreshes this file; edit it only when its human owner chooses to.

role_defaults:
  setup: T6
  business-analyst: T3
  system-analyst: T2
  project-manager: T2
  test-planner: T3
  uxui-designer: T5
  backend-engineer: T5
  frontend-engineer: T5
  qa-engineer: T3
  security: T2
  devops: T5

tiers:
  T1:
    reserved: true
    camps:
      anthropic:
        model: opus
        effort: max
        notes: Maximum reasoning; reserved and never cast in the pipeline.
      openai:
        model: gpt-6-astra
        effort: max
        notes: Maximum reasoning; reserved and never cast in the pipeline.
      google:
        model: gemini-3.8-flash-high
        effort: native
        notes: Maximum reasoning; reserved and never cast in the pipeline.
      zai:
        model: zai-coding-plan/glm-5.2#max
        effort: native
        notes: Maximum reasoning; reserved and never cast in the pipeline.
  T2:
    camps:
      anthropic:
        model: opus
        effort: high
        notes: Planning and security grade; the highest tier a plan may cast.
      openai:
        model: gpt-6-astra
        effort: high
        notes: Planning and security grade.
      google:
        model: gemini-3.8-flash-high
        effort: native
        notes: Planning and security grade.
      zai:
        model: zai-coding-plan/glm-5.2#high
        effort: native
        notes: Planning and security grade.
  T3:
    camps:
      anthropic:
        model: opus
        effort: medium
        notes: Analysis grade and risky implementation or QA verification.
      openai:
