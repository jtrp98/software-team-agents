# Contract for the `test-planner` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: test-planner
  role: test-planner
  description: Decides what needs testing and at what level (unit/integration/API/E2E), before implementation starts, and writes test-plan.md.
input:
  required: [requirements, design, plan]
  optional: []
output:
  required: [test-plan]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  # Only qa-engineer marks a plan.md task done.
  - no_checkbox_writes
  # Has no AskUserQuestion on purpose: an unclear case goes back to system-analyst, never gets guessed.
  - no_rule_decisions
permissions:
  capabilities: [read, write_docs]
  # Owns test-plan.md.
  read: [".claude/agents/test-planner.md", ".claude/shared/**", "policies/**", "CLAUDE.md", "_docs/module/*/design.md", "_docs/module/*/plan.md", "_docs/module/*/requirement.md", "_docs/module/*/review.md", "_docs/module/*/test-plan.md", "_docs/status-archive.md", "_docs/status.md"]
  write: ["_docs/module/*/test-plan.md", "_docs/status.md", "_docs/status-archive.md"]
  deny: ["_docs/module/*/design.md", "_docs/module/*/requirement.md", "_docs/module/*/plan.md", "_docs/module/*/review.md", "_docs/module/*/security.md", "_docs/module/*/deploy.md"]
tools: [Read, Glob, Grep, Write, Edit]
states: [PLAN]
capability:
  languages: []
  frameworks: []
  database: []
  capabilities: [test-strategy]
