# Contract for the `security` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: security
  role: security
  description: Audits implemented code for real security defects, independently of whether QA passed it.
input:
  required: [requirements, design]
  optional: [qa-report, backend-code, frontend-code]
output:
  required: [security-report]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  # An engineer's fix moves a finding to Fix-claimed and no further — this agent is the only one that closes it.
  - sole_security_finding_closer
permissions:
  capabilities: [read, write_docs]
  # Owns security.md, and only it may close a finding. Writes no application code, for the same reason qa-engineer does not.
  read: [".claude/shared/**", "policies/**", "CLAUDE.md", "_docs/module/*/design.md", "_docs/module/*/requirement.md", "_docs/module/*/review.md", "_docs/module/*/security.md", "_docs/status-archive.md", "_docs/status.md", "app/**", "components/**", "package.json", "prisma/**", "server/**", "src/**"]
  write: ["_docs/module/*/security.md", "_docs/status.md", "_docs/status-archive.md"]
  deny: ["_docs/module/*/review.md", "app/**", "server/**", "prisma/**"]
tools: [Read, Glob, Grep, Bash, AskUserQuestion, Write, Edit]
states: [SECURITY]
capability:
  languages: ["typescript"]
  frameworks: []
  database: ["postgresql"]
  capabilities: [security-audit]
