# Contract for the `devops` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: devops
  role: devops
  description: Builds, deploys and migrates — only once qa-engineer, and security where required, have accepted the work.
input:
  required: [qa-report, plan]
  optional: [security-report, design, devops-docs]
output:
  required: [devops-docs]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  # Refuses an unaccepted phase, a TARGETED-only round, an unaudited security gate, or open findings.
  - no_deploy_without_verification
  # Preparing a Dockerfile or a dry-run may proceed; running it against something real never does.
  - human_confirmation_required
permissions:
  capabilities: [read, build, deploy, rollback]
  # Owns deploy.md and the infrastructure files. Application code is denied: shipping is not the moment to change what is being shipped.
  read: [".claude/shared/**", "policies/**", ".dockerignore", ".github/**", "CLAUDE.md", "Dockerfile", "_docs/module/*/deploy.md", "_docs/module/*/design.md", "_docs/module/*/plan.md", "_docs/module/*/requirement.md", "_docs/module/*/review.md", "_docs/module/*/security.md", "_docs/status-archive.md", "_docs/status.md", "deploy/**", "docker-compose*.yml", "infra/**", "package.json", "prisma/**"]
  write: ["_docs/module/*/deploy.md", "_docs/status.md", "_docs/status-archive.md", "Dockerfile", "docker-compose*.yml", ".github/**", ".dockerignore", "infra/**", "deploy/**"]
  deny: ["_docs/module/*/requirement.md", "_docs/module/*/design.md", "_docs/module/*/plan.md", "_docs/module/*/review.md", "_docs/module/*/security.md", "app/**", "server/**", "prisma/**"]
tools: [Bash, Read, Write, Edit, Glob, Grep, AskUserQuestion]
states: [READY_TO_DEPLOY, APPROVED, DEPLOYED]
capability:
  languages: ["typescript"]
  frameworks: ["docker"]
  database: ["postgresql"]
  capabilities: [deployment, migration, ci]
