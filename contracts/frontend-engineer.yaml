# Contract for the `frontend-engineer` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: frontend-engineer
  role: frontend-engineer
  description: Implements UI code from design.md and from the API the backend actually built.
input:
  required: [plan, design, requirements, test-plan]
  optional: [qa-report, frontend-code]
output:
  required: [frontend-code]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - must_follow_design
  - no_schema_guessing
  - no_checkbox_writes
  - green_before_handoff
  - no_rule_decisions
  # Reads the route's real request/response shape rather than guessing it from design.md alone —
  # that guess is what produced a shipped response-shape mismatch once already.
  - backend_before_frontend
permissions:
  capabilities: [read, write_code, test]
  # Role boundary only (T-V5-023). Where UI code lives — and which of it belongs to backend-engineer instead — is stack layout,
  # so it comes from `stacks/<profile>/stack.yaml` `permissions.frontend-engineer` and is merged with these globs at run time.
  # A workspace with no recorded stack resolves `stacks/frontend`, which carries the globs this contract used to hold, including
  # the `prisma/**` / `server/**` / `app/api/**` denies that policies/agent-boundaries.md §6a exists to enforce.
  read: [".claude/agents/frontend-engineer.md", ".claude/shared/**", "policies/**", "CLAUDE.md", "_docs/module/*/design.md", "_docs/module/*/plan.md", "_docs/module/*/requirement.md", "_docs/module/*/review.md", "_docs/module/*/test-plan.md", "_docs/status-archive.md", "_docs/status.md"]
  write: ["_docs/status.md", "_docs/status-archive.md"]
  deny: ["_docs/module/**", ".claude/**", "contracts/**"]
tools: [Write, Edit, Read, Glob, Grep, Bash]
states: [IMPLEMENTATION]
capability:
  languages: ["typescript"]
  frameworks: ["nextjs", "react", "tailwind", "zustand"]
  database: []
  capabilities: [ui, testing]
