# Contract for the `reviewer` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: reviewer
  role: reviewer
  description: Independently reviews implemented code against requirement.md, design.md and plan.md and records file:line findings in review.md; never fixes code and never claims QA verification.
input:
  required: [requirements, design, plan]
  # A phase can be backend-only or frontend-only; its own earlier review.md round is read when it exists.
  optional: [test-plan, review-report, backend-code, frontend-code]
output:
  required: [review-report]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  # A finding is a path:line pointer, never a bare opinion.
  - evidence_required
permissions:
  capabilities: [read, write_docs]
  # Owns review.md and its review/phase-N.md archive, nothing else. It reads the implementation and
  # the documents that define it, never qa.md/security.md: a review that starts from someone else's
  # verdict is not independent of it. It writes no application code — a reviewer that fixes what it
  # finds has reviewed its own work. No _docs/status*.md: generated by generate-status.js, which the
  # reviewer cannot run (no Bash), same as project-manager.
  read: [".claude/agents/reviewer.md", ".claude/agents/backend-engineer.md", ".claude/agents/frontend-engineer.md", ".claude/shared/**", "policies/**", "CLAUDE.md", "_docs/module/*/requirement.md", "_docs/module/*/design.md", "_docs/module/*/plan.md", "_docs/module/*/test-plan.md", "_docs/module/*/review.md", "_docs/module/*/review/**", "_docs/status.md", "app/**", "components/**", "package.json", "prisma/**", "server/**", "src/**"]
  write: ["_docs/module/*/review.md", "_docs/module/*/review/**"]
  deny: ["_docs/module/*/requirement.md", "_docs/module/*/design.md", "_docs/module/*/design-archive.md", "_docs/module/*/plan.md", "_docs/module/*/test-plan.md", "_docs/module/*/qa.md", "_docs/module/*/qa/**", "_docs/module/*/security.md", "_docs/module/*/deploy.md", "_docs/module/*/uxui/**", "_docs/status.md", "_docs/status-archive.md", "app/**", "components/**", "server/**", "src/**", "prisma/**", "public/**", "styles/**", "package.json", "package-lock.json", ".claude/**", "knowledge/**"]
tools: [Read, Glob, Grep, Write, Edit]
states: [REVIEW]
capability:
  languages: []
  frameworks: []
  database: []
  capabilities: [code-review]
