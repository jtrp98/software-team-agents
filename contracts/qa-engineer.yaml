# Contract for the `qa-engineer` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: qa-engineer
  role: qa-engineer
  description: Verifies implemented code against requirement.md and design.md with evidence, and is the only role that marks a plan.md task done.
input:
  required: [requirements, design, plan]
  # A phase can be backend-only or frontend-only; requiring both would fail a legitimate phase.
  optional: [backend-code, frontend-code]
output:
  required: [qa-report]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  # A verdict is a checkable pointer, never a bare verbal PASS.
  - evidence_required
  # FULL closes a phase; TARGETED never does, and must say what it did not cover.
  - must_state_verify_mode
  # An item that survives two fixes is usually misrouted, not badly implemented.
  - escalate_after_second_failure
  # Its pass is functional; only `security` moves a security finding to Fixed.
  - cannot_close_security_finding
permissions:
  capabilities: [read, test, write_docs]
  read: []
  write: []
tools: [Read, Glob, Grep, Bash, AskUserQuestion, Write, Edit]
states: [QA]
