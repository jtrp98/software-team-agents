# Contract for the `qa-engineer` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: qa-engineer
  role: qa-engineer
  description: Verifies implemented code against requirement.md and design.md with evidence, and is the only role that marks a plan.md task done.
input:
  required: [requirements, design, plan, test-plan]
  # A phase can be backend-only or frontend-only; requiring both would fail a legitimate phase.
  optional: [backend-code, frontend-code, qa-evidence]
output:
  required: [qa-report]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  # A verdict is a checkable pointer, never a bare verbal PASS.
  - evidence_required
  # FULL closes a phase; TARGETED never does, and must say what it did not cover.
  - must_state_verify_mode
  # The orchestrator's TARGETED/FULL decision is binding: a TARGETED round may
  # not close a task whose recorded decision is FULL (the gate refuses it).
  - respect_recorded_mode_decision
  # An item that survives two fixes is usually misrouted, not badly implemented.
  - escalate_after_second_failure
  # Its pass is functional; only `security` moves a security finding to Fixed.
  - cannot_close_security_finding
permissions:
  capabilities: [read, test, write_docs]
  # Owns review.md, and is the only role that may edit a plan.md task's Status cell. It writes no
  # application code at all: a verifier that fixes what it finds is no longer verifying.
  # T-LV3: this `write` list is single-repo/legacy shaped, same as every other contract — the
  # three-repo split (T-UX13/T-WG3) is layered on top by .claude/hooks/block-path-permissions.js's
  # WORKSPACE_BA_ARTIFACTS, not by this file, so plan.md stays listed here for that mode. In a
  # `role: dev` Target workspace the hook already denies plan.md unconditionally regardless of this
  # grant; qa-engineer.md's "Knowledge / Target / three-repo mode" section covers what to do instead
  # (record the verdict in review.md's `## Knowledge sync` table for a BA-lane session to apply).
  read: [".claude/agents/backend-engineer.md", ".claude/agents/frontend-engineer.md", ".claude/scripts/**", ".claude/shared/**", "policies/**", "CLAUDE.md", "_docs/module/**", "_docs/status-archive.md", "_docs/status.md", "app/**", "components/**", "package.json", "prisma/**", "server/**", "src/**"]
  write: ["_docs/module/*/review.md", "_docs/module/*/review/**", "_docs/module/*/plan.md", "_docs/status.md", "_docs/status-archive.md"]
  deny: ["_docs/module/*/design.md", "_docs/module/*/requirement.md", "_docs/module/*/security.md", "app/**", "server/**", "prisma/**"]
tools: [Read, Glob, Grep, Bash, AskUserQuestion, Write, Edit]
states: [QA]
capability:
  languages: ["typescript"]
  frameworks: []
  database: ["postgresql"]
  capabilities: [verification, testing]
