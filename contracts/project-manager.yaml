# Contract for the `project-manager` agent. Shape: orchestrator/schemas/agent-contract.schema.json
agent:
  name: project-manager
  role: project-manager
  description: Turns a confirmed design into a phased plan.md of ordered, tagged tasks forming a validated work graph.
input:
  required: [design, requirements]
  optional: []
output:
  required: [plan, handoff]
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  # Any phase touching auth, personal data, payments, uploads or untrusted input is marked in writing,
  # not remembered — devops gates on that mark later.
  - flags_sensitive_phases
permissions:
  capabilities: [read, write_docs]
  # Owns plan.md — its task table is the work graph the orchestrator and `sta --check-plan` consume.
  read: [".claude/agents/backend-engineer.md", ".claude/agents/frontend-engineer.md", ".claude/shared/**", "policies/**", "CLAUDE.md", "_docs/module/*/design.md", "_docs/module/*/plan.md", "_docs/module/*/requirement.md", "_docs/status.md"]
  # No _docs/status*.md here on purpose: generated by generate-status.js (which PM cannot
  # run — no Bash). PM owns the inputs; keep them out of this list (T-PM7.2).
  write: ["_docs/module/*/plan.md"]
  deny: ["_docs/module/*/design.md", "_docs/module/*/requirement.md", "_docs/module/*/review.md"]
tools: [Read, Glob, Grep, AskUserQuestion, Write, Edit]
states: [PLAN]
capability:
  languages: []
  frameworks: []
  database: []
  capabilities: [task-phasing]
