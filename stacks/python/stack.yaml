# Named so a Python project has one obvious home rather than an invented one. Nothing in this
# repo targets it; it is a profile, not a claim that anything can build it.
stack: python
kind: backend
language: python
runtime: python-3.12
frameworks: [fastapi, pydantic]
orm: sqlalchemy
database: [postgresql]
api: [rest]
package_manager: uv
commands:
  install: uv sync
  build: uv build
  test: pytest
  lint: ruff check
  typecheck: mypy .
scan_extensions: [.py]
capabilities: [rest-api, database-access, auth, testing]

# T-V5-023 — the layout half of the engineer path rules; `{source_root}` expands from the
# Target's recorded `stack.source_roots`. Layout only: nothing here claims a prompt can
# build Python.
permissions:
  backend-engineer:
    read: ["{source_root}/**", "pyproject.toml", "requirements.txt", "setup.py"]
    write: ["{source_root}/**"]
    deny: ["{source_root}/.venv/**", "{source_root}/__pycache__/**", "{source_root}/static/**", "{source_root}/templates/**"]
  frontend-engineer:
    read: ["{source_root}/**", "pyproject.toml"]
    write: ["{source_root}/static/**", "{source_root}/templates/**"]
    deny: ["{source_root}/.venv/**", "{source_root}/__pycache__/**"]
