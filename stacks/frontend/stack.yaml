# The frontend stack, unchanged between the current and target backends — which is why it is
# its own profile rather than a field on each backend one.
stack: frontend
kind: frontend
language: typescript
runtime: node
frameworks: [nextjs, react, tailwind, zustand]
database: []
api: [rest]
package_manager: npm
commands:
  install: npm install
  build: npm run build
  test: npm test
  lint: npm run lint
  typecheck: npm run typecheck
scan_extensions: [.ts, .tsx, .js, .jsx]
capabilities: [ui, testing]

# T-V5-023 — the layout half of the engineer path rules, and the fallback for a
# `frontend-engineer` in a workspace with no recorded stack. Exactly the globs
# `contracts/frontend-engineer.yaml` carried before the split.
permissions:
  frontend-engineer:
    read: ["app/**", "components/**", "package.json", "public/**", "server/**", "src/**", "styles/**"]
    write: ["app/**", "components/**", "src/components/**", "src/app/**", "styles/**", "public/**"]
    deny: ["prisma/**", "server/**", "app/api/**"]
