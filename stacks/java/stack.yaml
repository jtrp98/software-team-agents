# Named so a Java project has one obvious home rather than an invented one. Nothing in this
# repo targets it; it is a profile, not a claim that anything can build it.
stack: java
kind: backend
language: java
runtime: jdk-21
frameworks: [spring-boot]
orm: hibernate
database: [postgresql]
api: [rest, grpc]
package_manager: maven
commands:
  install: mvn dependency:resolve
  build: mvn package
  test: mvn test
  lint: mvn checkstyle:check
  typecheck: mvn compile
scan_extensions: [.java]
capabilities: [rest-api, grpc, database-access, auth, testing]

# T-V5-023 — the layout half of the engineer path rules; `{source_root}` expands from the
# Target's recorded `stack.source_roots`. Maven/Gradle layout only: nothing here claims a
# prompt can build Java.
permissions:
  backend-engineer:
    read: ["{source_root}/**", "pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]
    write: ["{source_root}/src/main/java/**", "{source_root}/src/main/kotlin/**", "{source_root}/src/main/resources/**", "{source_root}/src/test/java/**", "{source_root}/src/test/kotlin/**"]
    deny: ["{source_root}/target/**", "{source_root}/build/**", "{source_root}/src/main/resources/static/**", "{source_root}/src/main/resources/templates/**"]
  frontend-engineer:
    read: ["{source_root}/**", "pom.xml", "build.gradle", "build.gradle.kts"]
    write: ["{source_root}/src/main/resources/static/**", "{source_root}/src/main/resources/templates/**"]
    deny: ["{source_root}/target/**", "{source_root}/build/**", "{source_root}/src/main/java/**", "{source_root}/src/main/kotlin/**"]
