# The backend stack the agent prompts implement today. `.claude/agents/backend-engineer.md`
# is the authoritative prose version; this file is the machine-readable twin, and
# --check-profile fails if they disagree about the language.
stack: node
kind: backend
language: typescript
runtime: node
frameworks: [express, zod]
orm: prisma
database: [postgresql]
api: [rest]
package_manager: npm
commands:
  install: npm install
  build: npm run build
  test: npm test
  lint: npm run lint
  typecheck: npm run typecheck
scan_extensions: [.ts, .tsx, .js, .jsx, .prisma]
capabilities: [rest-api, database-access, auth, testing]

# T-V5-023 — the layout half of the engineer path rules. `contracts/backend-engineer.yaml`
# keeps the role boundary; these globs say where a Node/Prisma repository puts backend code.
# This profile is also the fallback for a workspace that has recorded no stack, so these
# lists are exactly what the contract carried before the split — an existing installation
# resolves the same write set it always had.
permissions:
  backend-engineer:
    read: ["app/**", "package.json", "prisma/**", "server/**", "src/**"]
    write: ["server/**", "src/server/**", "src/lib/**", "app/api/**", "prisma/**", "package.json"]
    deny: ["components/**"]
